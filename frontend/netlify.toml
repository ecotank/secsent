[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/v1/letters/*"
  to = "/.netlify/functions/letters"
  status = 200

[[redirects]]
  from = "/api/v1/letters"
  to = "/.netlify/functions/letters"
  status = 200
